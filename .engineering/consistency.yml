schema: aicontext/consistency/v1

version:
  source: package.json

commands:
  documented:
    - command: "bun create JhonMA82/pi-extension-boilerplate <destination>"
      references:
        - README.md
        - docs/WORKFLOW.md
    - command: "bun run init"
      references:
        - README.md
        - docs/WORKFLOW.md
    - command: "bun run generate -- <command|tool|service|menu> <name>"
      references:
        - README.md
        - docs/WORKFLOW.md
        - .engineering/PATTERNS.md
    - command: "bun run check"
      references:
        - README.md
        - docs/WORKFLOW.md
    - command: "bun run pack:check"
      references:
        - README.md
        - docs/WORKFLOW.md

protected:
  - path: "scripts/init.ts"
    policy: explicit-task-only
  - path: "scripts/scaffold.ts"
    policy: explicit-task-only
  - path: ".engineering/aicontext.toml"
    policy: explicit-task-only
  - path: ".engineering/consistency.yml"
    policy: explicit-task-only
